services:
  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_CONNECTION_STRING: mongodb://mongo:27017/backend-app
      REDIS_URL: redis://redis:6379
    volumes:
      - ./uploads:/srv/api/uploads
      - ./logs:/srv/api/logs
      # mount DocuSign private key (never commit it):
      # - ./certs/docusign:/srv/api/certs/docusign:ro
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data:
