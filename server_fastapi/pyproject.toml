[project]
name = "hearthstone-api-fastapi"
version = "0.0.1"
description = "FastAPI port of server_node (Lost Fish / Hearthstone API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "motor>=3.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.2",
    "redis>=5.0",
    "hiredis>=2.4",
    "python-socketio>=5.11",
    "jinja2>=3.1",
    "boto3>=1.34",
    "azure-storage-blob>=12.20",
    "googlemaps>=4.10",
    "docusign-esign>=6.3",
    "slowapi>=0.1.9",
    "typer>=0.12",
    "faker>=25.0",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mongomock-motor>=0.0.32",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
# strict-ish without breaking FastAPI patterns
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true

[tool.uvicorn]
port = 3000

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
